<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interactive Example</title>
  <link rel="stylesheet" href="styles.css"> <!-- optional -->
  <script src="script.js"></script>
</head>
<body>
  <h1 id="title">Welcome!</h1>
  <p id="para">This paragraph will change color and text.</p>

  <button id="headerBlueBtn">Make header blue</button>
  <button id="paraPurpleBtn">Make paragraph purple</button>

  <hr>

  <input id="nameInput" placeholder="Type your name">
  <button id="greetBtn">Greet me</button>

  <div id="message"></div>
</body>
</html>
